[package]
name = "arclive"
version = "0.1.0"
edition = "2021"
description = "ArcLive DJ — native Rust two-deck DJ workstation"
license = "MIT"
authors = ["ArcLive"]
default-run = "ArcLive"

[[bin]]
name = "ArcLive"
path = "src/main.rs"

[dependencies]
slint = { version = "1.14", default-features = true, features = ["unstable-winit-030"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "pcm", "isomp4", "aac", "all"] }
rtrb = "0.3"
rubato = "0.15"
realfft = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
once_cell = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
hound = "3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.14"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 1
